query ActionLogs($data: GetActionLogsInput) {
  actionLogs(data: $data) {
    ...ActionLogListFields
  }
}

fragment ActionLogListFields on ActionLog {
  id
  title
  user {
    firstName
  }
  createdAt
}

query Notes($data: GetNotesInput!) {
  notes(data: $data) {
    ...NotesFields
  }
}

fragment NotesFields on Note {
  id
  text
  user {
    firstName
  }
  parentId
  type
  createdAt
}
