query Factories {
  factories {
    ...FactoryListFields
  }
}

query FactoryCodes {
  factories {
    ...FactoryCodes
  }
}

mutation CreateFactory($data: CreateCompanyInput!) {
  createFactory(data: $data) {
    code
  }
}

fragment FactoryListFields on Company {
  id
  code
  name
  address
  contacts {
    email
  }
}

fragment FactoryCodes on Company {
  code
}
