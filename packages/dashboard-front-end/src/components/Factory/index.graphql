query Factories {
  factories {
    ...FactoryListFields
  }
}

query FactoryCodes {
  factories {
    ...FactoryCodes
  }
}

mutation CreateFactory($data: CreateFactoryInput!) {
  createFactory(data: $data) {
    code
  }
}

fragment FactoryListFields on Factory {
  code
  name
  address
  email
}

fragment FactoryCodes on Factory {
  code
}
