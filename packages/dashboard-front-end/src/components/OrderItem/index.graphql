query OrderItems($data: GetOrderItemsInput) {
  orderItems(data: $data) {
    ...OrderItemListFields
  }
}

query OrderItemsGroupedByAttributes($data: GetOrderItemsInput!) {
  orderItemsGroupedByAttributes(data: $data) {
    ...OrderItemsGroupedByAttributesFields
  }
}

fragment OrderItemsGroupedByAttributesFields on OrderItemsGroupedByAttributes {
  productCode
  variantSets {
    quantity
    attributes {
      key
      value
      unit
    }
  }
  quantity
  unitPrice
  extPrice
}

fragment OrderItemListFields on OrderItem {
  ...OrderItemOwnFields
  product {
    code
  }
}

fragment OrderItemOwnFields on OrderItem {
  id
  quantity
  price
  variantAttributes {
    key
    value
  }
}

mutation CreateOrderItem($data: CreateOrderItemInput!) {
  createOrderItem(data: $data) {
    ...OrderItemOwnFields
  }
}
