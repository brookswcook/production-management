mutation CreateProduct($data: CreateProductInput!) {
  createProduct(data: $data) {
    code
  }
}

query Style($code: String!) {
  style(code: $code) {
    code
    name
  }
}

query Styles {
  styles {
    code
    name
  }
}

mutation CreateStyle($data: CreateStyleInput!) {
  createStyle(data: $data) {
    code
    name
  }
}
