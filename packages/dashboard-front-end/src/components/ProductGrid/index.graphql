fragment sampleFields on Sample {
  sku
  approved
  trackNumber
  delivered
}

fragment fitSampleFields on FitSample {
  sku
  approved
  trackNumber
  delivered
}

fragment productFields on Product {
  code
  name
  deliveryDate
  dueIn
  onTime
  stage
  factoryName
  techPackUploaded
  fabricSampleDelivered
  fitSampleDelivered
  style {
    code
    name
    techPackFileName
    techPackUploaded
  }
  fabric {
    code
    colorName
    type
    colorType
    colorCode
    printFileName
    samples {
      sku
      approved
      trackNumber
      delivered
    }
  }
  fitSamples {
    ...fitSampleFields
  }
  preProductionSample {
    ...fitSampleFields
  }
  fabricProduction {
    lastStartDate
    sufficientFabric
    started
    actualStartDate
    onTime
  }
  production {
    lastStartDate
    actualStartDate
    onTime
    started
  }
  qualityControl {
    lastVisitDate
    scheduledVisitDate
    visited
    passed
    notes
  }
  shipping {
    lastShippingDate
    actualShippingDate
    shipped
    trackNumber
    delivered
  }
}

query Products {
  products {
    ...productFields
  }
}

query Product($code: String!) {
  product(code: $code) {
    ...productFields
  }
}
