fragment noteFields on Note {
  id
  type
  text
  imageFileNames
  createdAt
  user {
    firstName
    fullName
  }
}

fragment sampleFields on Sample {
  sku
  approved
  trackNumber
  delivered
  note {
    ...noteFields
  }
}

fragment fitSampleFields on FitSample {
  sku
  approved
  trackNumber
  delivered
  note {
    ...noteFields
  }
}

fragment fabricSampleFields on FabricSample {
  sku
  approved
  trackNumber
  delivered
  note {
    ...noteFields
  }
}

fragment productFields on Product {
  id
  code
  name
  deliveryDate
  dueIn
  onTime
  stage
  factoryName
  techPackUploaded
  fabricSampleDelivered
  fitSampleDelivered
  style {
    code
    name
    techPackFileNames
    techPackUploaded
  }
  fabric {
    code
    title
    colorName
    type
    colorType
    colorCode
    printFileName
    stage
    samples {
      ...fabricSampleFields
    }
  }
  fitSamples {
    ...fitSampleFields
  }
  preProductionSample {
    ...fitSampleFields
  }
  notes {
    ...noteFields
  }
  fabricProduction {
    lastStartDate
    sufficientFabric
    started
    actualStartDate
    onTime
  }
  production {
    lastStartDate
    actualStartDate
    onTime
    started
  }
  qualityControl {
    lastVisitDate
    scheduledVisitDate
    visited
    passed
    notes
  }
  shipping {
    lastShippingDate
    actualShippingDate
    shipped
    trackNumber
    delivered
  }
}

query Products {
  products {
    ...productFields
  }
}

query Product($code: String!) {
  product(code: $code) {
    ...productFields
  }
}
