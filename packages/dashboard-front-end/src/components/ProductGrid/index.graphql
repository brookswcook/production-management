query Products {
  products {
    name
    model
    style
    sku
    deliveryDate
    dueIn
    onTime
    techPack {
      fabricCode
      type
      print
      pantone
      color
    }
    fabricSample {
      sku
    }
    fitSamples {
      sku
      approved
    }
    preProductionSample {
      sku
    }
    fabricProduction {
      lastStartDate
      sufficientFabric
      started
      actualStartDate
      onTime
    }
    production {
      lastStartDate
      onTime
    }
    qualityControl {
      lastVisitDate
    }
    shipping {
      lastShippingDate
    }
  }
}
