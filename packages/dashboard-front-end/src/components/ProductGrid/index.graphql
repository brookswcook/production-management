fragment sampleFields on Sample {
  sku
  approved
  trackNumber
  delivered
}

fragment fitSampleFields on FitSample {
  sku
  approved
  trackNumber
  delivered
}

fragment productFields on Product {
  name
  model
  style
  sku
  deliveryDate
  dueIn
  onTime
  stage
  techPackUploaded
  fabricSampleDelivered
  fitSampleDelivered
  techPack {
    fabricCode
    type
    print
    pantone
    color
  }
  fabricSample {
    ...sampleFields
  }
  fitSamples {
    ...fitSampleFields
  }
  preProductionSample {
    ...fitSampleFields
  }
  fabricProduction {
    lastStartDate
    sufficientFabric
    started
    actualStartDate
    onTime
  }
  production {
    lastStartDate
    onTime
  }
  qualityControl {
    lastVisitDate
  }
  shipping {
    lastShippingDate
  }
}

query Products {
  products {
    ...productFields
  }
}
