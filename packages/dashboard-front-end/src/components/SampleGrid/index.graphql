mutation ApproveFitSample($data: UniqueSampleInput!) {
  approveFitSample(data: $data) {
    sku
  }
}

mutation UnApproveFitSample($data: UniqueSampleInput!) {
  unApproveFitSample(data: $data) {
    sku
  }
}

