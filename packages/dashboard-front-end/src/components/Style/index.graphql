query Style($code: String!) {
  style(code: $code) {
    ...styleFields
  }
}

query Styles {
  styles {
    ...styleFields
  }
}

fragment styleFields on Style {
  code
  name
  techPackUploaded
  techPacks {
    name
    extName
    uploadingKey
    user {
      fullName
    }
  }
  productCodes
}

mutation CreateStyle($data: CreateStyleInput!) {
  createStyle(data: $data) {
    code
    name
  }
}
