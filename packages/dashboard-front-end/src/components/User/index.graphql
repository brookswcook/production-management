query Users {
  users {
    ...UserListFields
  }
}

fragment UserListFields on User {
  id
  email
  fullName
  role
  disabled
  firebaseUser {
    emailVerified
    metadata {
      creationTime
      lastSignInTime
    }
  }
}

mutation CreateUser($data: CreateUserInput!) {
  createUser(data: $data) {
    email
    role
  }
}
